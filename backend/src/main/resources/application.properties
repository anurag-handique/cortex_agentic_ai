spring.application.name=ai
ollama.api.url=http://localhost:11434/api/generate

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/cortex_ai
spring.datasource.username=postgres
spring.datasource.password=785601
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# JWT Configuration
# Use a strong secret key for production
jwt.secret=v7XzK9nL2mP8qR5sT4wY1bC3dN6fG9hJ2kM5pQ8rT0vW3yB6nS9xP4zV8cM7kF2
# 24 hours in milliseconds
jwt.expiration=86400000

# Spring AI - Ollama
spring.ai.ollama.base-url=http://localhost:11434
# Ensure we use a model that supports embeddings. nomic-embed-text is standard.
spring.ai.ollama.embedding.model=nomic-embed-text
spring.ai.ollama.chat.model=llama3

# Spring AI - Vector Store (PgVector)
# Ensure the 'vector' extension is enabled in Postgres
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
# Dimensions must match the embedding model (nomic-embed-text is 768)
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.initialize-schema=true

